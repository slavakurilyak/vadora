<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widget preview</title>
<style>
 body{margin:0;font:14px system-ui,sans-serif;background:#ececec;color:#111}
 header{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:end;padding:.75rem 1rem;background:#fff;border-bottom:1px solid #d0d0d0}
 label{display:flex;flex-direction:column;gap:.2rem;font-size:12px;color:#444}
 select{font:inherit;padding:.25rem}
 main{padding:1rem}
 body.bare header,body.bare #log,body.bare #note{display:none}
 #stage.inline{max-width:var(--width,480px);margin:0 auto}
 #stage.dark{--page:#212121}
 #frame{border:1px solid #d0d0d0;border-radius:12px;overflow:hidden;background:#fff;position:relative}
 #stage.dark #frame{background:#212121;border-color:#3a3a3a}
 #frame iframe{width:100%;border:0;display:block;color-scheme:normal}
 #close{position:absolute;top:.5rem;right:.5rem;z-index:2;font:inherit;padding:.25rem .6rem;border-radius:.5rem;border:1px solid #888;background:#fff;color:#111;cursor:pointer}
 #log{font:12px ui-monospace,Menlo,monospace;white-space:pre-wrap;max-width:60rem;margin:1rem auto 0;padding:.75rem;background:#fff;border:1px solid #d0d0d0;border-radius:8px;min-height:3rem}
 #note{max-width:60rem;margin:1rem auto 0;font-size:12px;color:#555}
</style>
</head>
<body>
<header>
 <label>View<select id="scenario">
  <option value="shop">Marketplace, shop</option>
  <option value="both">Marketplace, shop and sell</option>
  <option value="sell">Merchant workspace</option>
  <option value="cart">Cart</option>
  <option value="cart-empty">Cart, empty</option>
 </select></label>
 <label>Display mode<select id="mode"><option value="inline">Inline card</option><option value="fullscreen">Fullscreen</option></select></label>
 <label>Order<select id="order"><option value="none">No order</option><option value="pending">Payment pending</option><option value="paid">Paid</option></select></label>
 <label>Theme<select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
 <label>Style variables<select id="variables"><option value="none">None, fallback palette</option><option value="host">Host variables</option></select></label>
 <label>Text size<select id="scale"><option value="100">100%</option><option value="150">150%</option><option value="200">200%</option></select></label>
 <label>Inline width<select id="width"><option value="360">360 px</option><option value="480" selected>480 px</option><option value="720">720 px</option></select></label>
</header>
<main>
 <div id="stage" class="inline light"><div id="frame"><button id="close" type="button" hidden>Close</button></div></div>
 <pre id="log"></pre>
 <p id="note">This is a preview host on this machine. It embeds the real widget, answers its tool calls with labeled TEST products, and never opens a link, sends a message, or moves money. ChatGPT draws the widget with its own chrome and style variables.</p>
</main>
<script type="module" src="/host.js"></script>
</body>
</html>
